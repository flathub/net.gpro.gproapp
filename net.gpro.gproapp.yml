app-id: net.gpro.gproapp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: startgpro
rename-icon: gpro
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  # needed to integrate with Steam for profile linking
  - --filesystem=home
modules:
  - name: gpro
    buildsystem: simple
    build-commands:
      - ar x gpro.deb
      - tar xf data.tar.xz -C /app --strip-components=2 ./opt ./usr
      - install -Dm644 /app/GPRO/flatpak/net.gpro.gproapp.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 /app/GPRO/flatpak/net.gpro.gproapp.desktop -t /app/share/applications/
      - install -Dm755 /app/GPRO/flatpak/startgpro -t /app/bin/
      - rm /app/share/icons/hicolor/1024x1024/apps/gpro.png
    sources:
      - type: file
        dest-filename: gpro.deb
        url: https://github.com/gpronet/gproapppub/releases/download/v1.0.190/GPRO_1.0.190_amd64.deb
        sha256: a2766ff249bdfa6ce69d54d1ea2aeffdf0d5cd9a2032c7f8476c70042ca3c286
        only-arches:
          - x86_64
      - type: file
        dest-filename: gpro.deb
        url: https://github.com/gpronet/gproapppub/releases/download/v1.0.190/GPRO_1.0.190_arm64.deb
        sha256: efd37fa278cf2aa7e332dc93d23365f2bfa34709ef44e7cb9f09f9d746fa6870
        only-arches:
          - aarch64
