app-id: net.gpro.gproapp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: startgpro
rename-icon: gpro
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  # needed to integrate with Steam for profile linking
  - --filesystem=home
modules:
  - name: gpro
    buildsystem: simple
    build-commands:
      - ar x gpro.deb
      - tar xf data.tar.xz -C /app --strip-components=2 ./opt ./usr
      - install -Dm644 /app/GPRO/flatpak/net.gpro.gproapp.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 /app/GPRO/flatpak/net.gpro.gproapp.desktop -t /app/share/applications/
      - install -Dm755 /app/GPRO/flatpak/startgpro -t /app/bin/
      - rm /app/share/icons/hicolor/1024x1024/apps/gpro.png
    sources:
      - type: file
        dest-filename: gpro.deb
        url: https://github.com/gpronet/gproapppub/releases/download/v1.0.198/GPRO_1.0.198_amd64.deb
        sha256: 00a16176a84cd07273472e6daf74503b92d96a1e928d27425e4f0e9151a57b18
        only-arches:
          - x86_64
      - type: file
        dest-filename: gpro.deb
        url: https://github.com/gpronet/gproapppub/releases/download/v1.0.198/GPRO_1.0.198_arm64.deb        
        sha256: f174c76c76e4b841327f26b978f68387c0f829d55691e4f5a331127ed9f6b895
        only-arches:
          - aarch64
