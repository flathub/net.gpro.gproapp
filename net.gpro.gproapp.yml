app-id: net.gpro.gproapp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: startgpro
rename-icon: gpro
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  # needed to integrate with Steam for profile linking
  - --filesystem=home
modules:
  - name: gpro
    buildsystem: simple
    build-commands:
      - ar x gpro.deb
      - tar xf data.tar.xz -C /app --strip-components=2 ./opt ./usr
      - install -Dm644 /app/GPRO/flatpak/net.gpro.gproapp.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 /app/GPRO/flatpak/net.gpro.gproapp.desktop -t /app/share/applications/
      - install -Dm755 /app/GPRO/flatpak/startgpro -t /app/bin/
      - rm /app/share/icons/hicolor/1024x1024/apps/gpro.png
    sources:
      - type: file
        dest-filename: gpro.deb
        url: https://github.com/gpronet/gproapppub/releases/download/v1.0.185/GPRO_1.0.185_amd64.deb
        sha256: 9da628d37f2e531b07c798d2089a73917e4f2fe8a80ab35faa8111537e918d6b
        only-arches:
          - x86_64
      - type: file
        dest-filename: gpro.deb
        url: https://github.com/gpronet/gproapppub/releases/download/v1.0.185/GPRO_1.0.185_arm64.deb
        sha256: 0e0e4a59915dd35c541ff7fb53405bb5b7f7e30efb6f95b5a99b70f4c52c95ed
        only-arches:
          - aarch64
