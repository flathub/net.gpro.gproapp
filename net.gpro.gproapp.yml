app-id: net.gpro.gproapp
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: startgpro
rename-icon: gpro
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  # needed to integrate with Steam for profile linking
  - --filesystem=home
modules:
  - name: gpro
    buildsystem: simple
    build-commands:
      - ar x gpro.deb
      - tar xf data.tar.xz -C /app --strip-components=2 ./opt ./usr
      - install -Dm644 /app/GPRO/flatpak/net.gpro.gproapp.metainfo.xml /app/share/metainfo/net.gpro.gproapp.metainfo.xml
      - install -Dm644 /app/GPRO/flatpak/net.gpro.gproapp.desktop /app/share/applications/net.gpro.gproapp.desktop
      - install -Dm755 /app/GPRO/flatpak/startgpro /app/bin/startgpro
     
      - rm /app/share/icons/hicolor/1024x1024/apps/gpro.png
      
    sources:
      - type: file
        dest-filename: gpro.deb
        url: https://github.com/gpronet/gproapppub/releases/download/v1.0.184/GPRO_1.0.184_amd64.deb
        sha256: 876e684d5ade6e121762b8c5d880c021889bc023400229cefe89c937336d5ec0
        only-arches:
          - x86_64
      - type: file
        dest-filename: gpro.deb
        url: https://github.com/gpronet/gproapppub/releases/download/v1.0.184/GPRO_1.0.184_arm64.deb
        sha256: 0e4d31ae251bc37619db3336da52e17bb54ee9f19cb708ffb86a244cb6e1b2e2
        only-arches:
          - aarch64