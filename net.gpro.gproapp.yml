app-id: net.gpro.gproapp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: startgpro
rename-icon: gpro
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  # needed to integrate with Steam for profile linking
  - --filesystem=home
modules:
  - name: gpro
    buildsystem: simple
    build-commands:
      - ar x gpro.deb
      - tar xf data.tar.xz -C /app --strip-components=2 ./opt ./usr
      - install -Dm644 /app/GPRO/flatpak/net.gpro.gproapp.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 /app/GPRO/flatpak/net.gpro.gproapp.desktop -t /app/share/applications/
      - install -Dm755 /app/GPRO/flatpak/startgpro -t /app/bin/
      - rm /app/share/icons/hicolor/1024x1024/apps/gpro.png
    sources:
      - type: file
        dest-filename: gpro.deb
        url: https://github.com/gpronet/gproapppub/releases/download/v1.0.192/GPRO_1.0.192_amd64.deb
        sha256: 4cc4dbba9a0283b00f343767405c817d0f724a5ed1303409716b25453444f7ac
        only-arches:
          - x86_64
      - type: file
        dest-filename: gpro.deb
        url: https://github.com/gpronet/gproapppub/releases/download/v1.0.192/GPRO_1.0.192_arm64.deb        
        sha256: 64e8be98535418518eb8964193f44483283de80413d9d7958fede74115a7f77e
        only-arches:
          - aarch64
